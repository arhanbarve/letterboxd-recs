app = "arhan-lbxd-recs"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  # Points at the mounted volume below, so an import survives a redeploy.
  DB_PATH = "/data/letterboxd.db"
  CORS_ORIGINS = "https://arhan-lbxd-recs.vercel.app"
  # Vercel preview deployments get a new hostname per push. Anchored, so this
  # cannot be widened into "any site hosted on Vercel".
  CORS_ORIGIN_REGEX = '^https://arhan-lbxd-recs(-[a-z0-9]+-[a-z0-9-]+)?\.vercel\.app$'

# API keys are set with `fly secrets set`, never here — this file is committed.

[mounts]
  source = "letterboxd_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite on a volume means exactly one machine may write, so this never
  # scales past one. Suspending when idle is what keeps it inside the free
  # allowance; the first request after a nap pays a second or two of wake-up.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
